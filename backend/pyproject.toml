[project]
name = "e3sm-assist-backend"
version = "0.1.0"
description = "Provider-independent FastAPI backend vertical slice for E3SM-ASSIST."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "llama-index-core>=0.14,<0.15",
  "pydantic>=2.11.0",
  "pydantic-ai-slim[openai]>=2,<3",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
  "python-dotenv>=1.1.0",
  "uvicorn>=0.35.0",
  "llama-index-embeddings-huggingface>=0.6,<0.7",
]

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e3sm_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["e3sm_assist"]
